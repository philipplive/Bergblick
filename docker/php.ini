; Entwicklungseinstellungen für den Map-Generator.

; Das Stitchen grosser Kartenausschnitte braucht Luft (siehe TileService: ~60 MB Canvas).
memory_limit = 512M

; Tile-Downloads und Textur-Rendering können dauern. Beim eingebauten
; Entwicklungsserver (CLI-SAPI) gilt ohnehin kein Zeitlimit — der Wert greift
; erst, wenn das Image später auf FPM/Apache umgestellt wird.
max_execution_time = 300

display_errors = On
error_reporting = E_ALL
